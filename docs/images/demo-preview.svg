<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="55%" stop-color="#1f2559"/>
      <stop offset="100%" stop-color="#3a1c71"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#ff758c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff758c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="dockShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Abstract Aurora Wallpaper -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- Top Menu Bar (Seelen UI Fancy Toolbar) -->
  <rect x="0" y="0" width="1280" height="32" fill="#141622" fill-opacity="0.72"/>
  <line x1="0" y1="32" x2="1280" y2="32" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="22" cy="16" r="5" fill="#7dd3fc"/>
  <text x="40" y="20" fill="#f8fafc" font-size="13" font-weight="600">Files (Finder Mode)</text>
  <text x="190" y="20" fill="#cbd5e1" font-size="12">Desktop 1</text>
  <text x="585" y="20" fill="#cbd5e1" font-size="12">Now Playing: Lo-fi Chill</text>
  <text x="1030" y="20" fill="#e2e8f0" font-size="12">Wi-Fi  |  89%  |  22:26</text>

  <!-- Left Window: Files App (Column View + Traffic Lights) -->
  <g filter="url(#shadow)">
    <rect x="84" y="76" width="660" height="450" rx="14" fill="#1c1e2a" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14"/>
    <!-- Titlebar -->
    <path d="M84 90 Q84 76 98 76 L730 76 Q744 76 744 90 L744 114 L84 114 Z" fill="#252836"/>
    <!-- Left Traffic Lights Pill -->
    <rect x="96" y="83" width="68" height="24" rx="12" fill="#1b1c22" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="110" cy="95" r="6" fill="#ff5f56"/>
    <circle cx="130" cy="95" r="6" fill="#ffbd2e"/>
    <circle cx="150" cy="95" r="6" fill="#27c93f"/>
    <text x="360" y="100" fill="#e2e8f0" font-size="13" font-weight="600">MacifyWin - Column View</text>

    <!-- Sidebar -->
    <rect x="84" y="114" width="145" height="412" fill="#161822" fill-opacity="0.75"/>
    <text x="102" y="142" fill="#94a3b8" font-size="11" font-weight="600">FAVORITES</text>
    <rect x="94" y="152" width="125" height="26" rx="6" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="108" y="169" fill="#93c5fd" font-size="12" font-weight="600">Desktop</text>
    <text x="108" y="198" fill="#cbd5e1" font-size="12">Documents</text>
    <text x="108" y="224" fill="#cbd5e1" font-size="12">Downloads</text>
    <text x="108" y="250" fill="#cbd5e1" font-size="12">MacifyWin</text>

    <!-- Column 1 -->
    <line x1="229" y1="114" x2="229" y2="526" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="237" y="130" width="150" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <text x="249" y="147" fill="#f8fafc" font-size="12">scripts/</text>
    <text x="249" y="178" fill="#cbd5e1" font-size="12">configs/</text>
    <text x="249" y="206" fill="#cbd5e1" font-size="12">tools/</text>
    <text x="249" y="234" fill="#cbd5e1" font-size="12">assets/</text>
    <text x="249" y="262" fill="#cbd5e1" font-size="12">install.bat</text>

    <!-- Column 2 -->
    <line x1="395" y1="114" x2="395" y2="526" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="403" y="130" width="155" height="26" rx="6" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="415" y="147" fill="#f8fafc" font-size="12">install.ps1</text>
    <text x="415" y="178" fill="#cbd5e1" font-size="12">uninstall.ps1</text>
    <text x="415" y="206" fill="#cbd5e1" font-size="12">apply-tweaks.ps1</text>
    <text x="415" y="234" fill="#cbd5e1" font-size="12">apply-assets.ps1</text>
    <text x="415" y="262" fill="#cbd5e1" font-size="12">setup-apps-theme.ps1</text>

    <!-- Preview Pane (Quick Look style) -->
    <line x1="566" y1="114" x2="566" y2="526" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="598" y="156" width="114" height="84" rx="10" fill="#2a2f45"/>
    <text x="633" y="204" fill="#93c5fd" font-size="16" font-weight="700">.PS1</text>
    <text x="596" y="268" fill="#f1f5f9" font-size="13" font-weight="600">install.ps1</text>
    <text x="596" y="290" fill="#94a3b8" font-size="11">Press Space for QuickLook</text>
  </g>

  <!-- Right Window: Acrylic Windows Terminal (Traffic Lights + Masked Right Corner) -->
  <g filter="url(#shadow)">
    <rect x="610" y="170" width="585" height="390" rx="14" fill="#12141e" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.18"/>
    <path d="M610 184 Q610 170 624 170 L1181 170 Q1195 170 1195 184 L1195 208 L610 208 Z" fill="#1d2030"/>
    <!-- Left Traffic Lights -->
    <rect x="622" y="177" width="68" height="24" rx="12" fill="#1b1c22" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="636" cy="189" r="6" fill="#ff5f56"/>
    <circle cx="656" cy="189" r="6" fill="#ffbd2e"/>
    <circle cx="676" cy="189" r="6" fill="#27c93f"/>
    <text x="835" y="194" fill="#e2e8f0" font-size="13" font-weight="600">Windows Terminal (Acrylic)</text>

    <!-- Terminal Output -->
    <text x="634" y="242" fill="#22d3ee" font-size="13" font-family="Consolas, monospace">==&gt; MacifyWin Installer (Build 22631)</text>
    <text x="634" y="270" fill="#4ade80" font-size="13" font-family="Consolas, monospace">[OK] System Restore Point &amp; Registry Backup created</text>
    <text x="634" y="296" fill="#4ade80" font-size="13" font-family="Consolas, monospace">[OK] Seelen UI (Floating Dock &amp; Top Bar) active</text>
    <text x="634" y="322" fill="#4ade80" font-size="13" font-family="Consolas, monospace">[OK] MacTrafficLights compiled &amp; right buttons hidden</text>
    <text x="634" y="348" fill="#4ade80" font-size="13" font-family="Consolas, monospace">[OK] Files App (Finder), QuickLook &amp; MacType ready</text>
    <text x="634" y="374" fill="#4ade80" font-size="13" font-family="Consolas, monospace">[OK] VS Code, Terminal &amp; Browser themes synced</text>
    <text x="634" y="416" fill="#c084fc" font-size="13" font-family="Consolas, monospace">PS D:\du_an\MacifyWin&gt; _</text>
  </g>

  <!-- Floating Centered macOS-Style Dock (Keeping Windows App Icons) -->
  <g filter="url(#dockShadow)">
    <rect x="410" y="636" width="460" height="68" rx="20" fill="#181b28" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.22"/>
    <!-- App Icons (Clean Windows-native shapes, no Apple logos) -->
    <!-- Files / Folder -->
    <rect x="432" y="648" width="42" height="42" rx="10" fill="#38bdf8"/>
    <circle cx="453" cy="696" r="2.5" fill="#ffffff"/>
    <!-- Browser -->
    <rect x="490" y="648" width="42" height="42" rx="10" fill="#3b82f6"/>
    <circle cx="511" cy="669" r="11" fill="#fde047"/>
    <circle cx="511" cy="669" r="6" fill="#2563eb"/>
    <circle cx="511" cy="696" r="2.5" fill="#ffffff"/>
    <!-- VS Code (Zoomed on hover) -->
    <rect x="546" y="640" width="50" height="50" rx="12" fill="#0ea5e9" stroke="#ffffff" stroke-opacity="0.35"/>
    <path d="M560 656 L584 665 L560 674 Z" fill="#ffffff"/>
    <circle cx="571" cy="696" r="2.5" fill="#ffffff"/>
    <!-- Terminal -->
    <rect x="612" y="648" width="42" height="42" rx="10" fill="#1e293b" stroke="#64748b"/>
    <text x="621" y="674" fill="#e2e8f0" font-size="15" font-weight="700" font-family="Consolas, monospace">&gt;_</text>
    <circle cx="633" cy="696" r="2.5" fill="#ffffff"/>
    <!-- Settings -->
    <rect x="670" y="648" width="42" height="42" rx="10" fill="#475569"/>
    <circle cx="691" cy="669" r="9" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Divider -->
    <line x1="728" y1="650" x2="728" y2="688" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Notes / Notepad -->
    <rect x="744" y="648" width="42" height="42" rx="10" fill="#eab308"/>
    <rect x="752" y="658" width="26" height="4" rx="2" fill="#ffffff"/>
    <rect x="752" y="666" width="20" height="4" rx="2" fill="#ffffff"/>
    <!-- Trash / Recycle Bin -->
    <rect x="802" y="648" width="42" height="42" rx="10" fill="#334155"/>
    <rect x="814" y="658" width="18" height="22" rx="3" fill="#94a3b8"/>
  </g>
</svg>
