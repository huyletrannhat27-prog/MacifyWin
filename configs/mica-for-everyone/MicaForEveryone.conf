# MacifyWin - Cau hinh Mica For Everyone (Windows 11)
# Ep hieu ung Acrylic/Mica va bo goc cho cac cua so Win32

Global {
  TitleBarColor              = System
  BackdropPreference         = Acrylic
  CornerPreference           = Rounded
  ExtendFrameIntoClientArea  = False
  EnableBlurBehind           = True
}

Process: "explorer" {
  BackdropPreference         = Mica
  CornerPreference           = Rounded
}

Process: "notepad" {
  BackdropPreference         = Acrylic
  CornerPreference           = Rounded
}

